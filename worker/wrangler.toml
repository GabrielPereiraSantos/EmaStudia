name = "ema-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Cron: a cada 5 minutos envia os lembretes vencidos.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ema-db"
# Troque pelo id mostrado por: npx wrangler d1 create ema-db
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Valores públicos. Segredos (ACCESS_CODE, VAPID_PRIVATE_KEY, GEMINI_API_KEY): npx wrangler secret put …
ALLOWED_ORIGIN = "https://ema-studia.pages.dev"
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "mailto:troque@exemplo.com"
# Modelo Flash do plano gratuito (confira no Google AI Studio). Se a cota for pouca, use o Flash-Lite.
GEMINI_MODEL = "gemini-2.5-flash"
GEMINI_DAILY_LIMIT = "20"
